# Base config for the iAIMS26 experiments.
#
# Pins the protocol of the revised IGEC2026 paper (era5_fric data, 7 static
# features, ICON-D2 + ECMWF HRES wind speeds) with the iAIMS26 test window
# 2025-08-01 .. 2026-01-31 (single training, no retraining between seasons;
# the seasonal split happens at analysis time).
#
# Hyperparameters are baked in (lookup_hpo: False). Initially these are the
# published IGEC values; gen_configs.py overrides them from
# iaims26/configs/hpo_best.json once the zero-shot HPO has finished.
#
# Never edit configs/config_wind_100.yaml for this paper — this file is the
# single source of truth for iAIMS26.

data:
  path: '/mnt/nvme1/synthetic/wind/era5_fric_wind_hourly_age'
  files: ['00298', '02907', '02564', '05930', '15813',
          '02932', '01759', '07403', '05404', '00662',
          '00596', '03098', '04642', '03366', '03158',
          '03362', '03032', '00591', '02812', '03946',
          '00303', '00891', '04336', '15000', '01694',
          '05490', '01605', '04271', '00656', '00691',
          '03761', '00198', '01443', '06163', '04464',
          '03513', '01975', '00427', '01691', '07394',
          '07370', '05906', '03093', '03268', '15444',
          '00282', '05440', '05779', '00460', '00856',
          '00963', '00704', '04745', '00342', '01766',
          '01544', '05516', '04466', '01200', '02171',
          '00880', '02794', '04393', '07369', '03126',
          '00232', '00164', '02261', '07393', '05158',
          '07412', '03379', '05349', '07341', '03028',
          '13674', '01684', '02925', '04177', '07368',
          '01303', '07395', '03015', '04280', '01262',
          '00183', '05546', '01587', '07410', '03631',
          '00433', '02712', '05029', '06197', '07374',
          '03660', '02597', '05800', '03196', '00867']
  power_curves_path: '/mnt/nvme1/synthetic/wind/power_curves'
  nwp_path: '/mnt/nvme1/icon-d2/parquet'
  ecmwf_path: '/mnt/nvme1/ecmwf/parquet'
  stations_master: 'data/stations_master.csv'
  freq: '1h'
  train_frac: 1
  val_frac: 0.25
  test_start: '2025-08-01'
  test_end: '2026-01-31'
  retrain_interval: 1
  eval_interval: 1
  target_col: 'power'
  scale_x: True
  scale_y: False
  use_pca: False
  pca_components: 3
  lag_in_col: False
  n_neighbors: 5

params:
  turbines: [
             'Enercon E-70 E4 2.300',
             'Enercon E-82 E2 2.000',
             'Enercon E-115 2.500',
             'Vestas V90',
             'Vestas V112-3.45',
             'Vestas V80-1.8'
            ]
  known_features: [
    'wind_speed_h78', 'wind_speed_h127', 'wind_speed_h184',
    'density_rotor_eq',
    'ecmwf_wind_speed_h100',
    'ecmwf_wind_speed_h200',
                   ]
  observed_features: [
                      'power'
                      ]
  static_features: [
    'park_age',
    'cut_in',
    'cut_out',
    'rated_wind_speed',
    'hub_height',
    'rotor_diameter',
    'altitude'
  ]
  aggregate_nwp_layers: 'weighted_mean'
  nwp_models: ['icon-d2', 'ecmwf']
  ecmwf_features: ['u_wind100m', 'v_wind100m', 'u_wind200m', 'v_wind200m']
  get_density: True
  turbines_per_park: 1
  random_seed: 42
  next_n_grid_points: 1
  aggregate_grid_points: False

model:
  num_workers: 0
  output_dim: 48
  lookback: 48
  horizon: 48
  step_size: 48
  batch_size: 46
  lr: 0.000195
  optimizer: 'adam'
  loss: 'mse'
  metrics: ['mae', 'rmse', 'r^2']
  fnn:
    units: 128
    n_layers: 2
  cnn:
    filters: 128
    kernel_size: 3
    n_cnn_layers: 10
    increase_filters: False
  rnn:
    n_rnn_layers: 2
    units: 64
    dropout: 0.01
  attention_heads: 32
  stemgnn:
    units: 32
    stack_cnt: 2
    multi_layer: 5
    dropout: 0.5
  tft:
    n_heads: 8
    hidden_dim: 40
    dropout: 0.0992
    n_lstm_layers: 1
    static_embedding_dim: 128
    num_quantiles: 1
    clipnorm: 6.9179
  callbacks: False
  save_model: True
  shuffle: True
  force_retrain: True
  early_stopping:
    enabled: True
    patience: 10
    min_delta: 0.0001
    monitor: 'val_rmse'
    mode: 'min'
    restore_best_weights: True
  parallelize: False
  lookup_hpo: False
  verbose: 1

hpo:
  studies_path: '/mnt/nas/optuna_studies/optuna_viktor.db'
  objectives:
    - metric: 'val_rmse'
      direction: 'minimize'
  trials: 100
  kfolds: 5
  min_train_date: '2024-04-30'
  val_split: 1
  pruning:
    use_median_pruner: True
    n_startup_trials: 10
    n_warmup_steps: 1
    interval_steps: 1
    disable_pruning: False
  batch_size: [32, 1024]
  epochs: [1, 150]
  n_layers: [1, 4]
  n_cnn_layers: [1, 10]
  n_rnn_layers: [1, 7]
  learning_rate: [0.0001, 0.01]
  attention_heads: [1, 64]
  fnn:
    units: [32, 256]
  cnn:
    filters: [16, 128]
    kernel_size: [2, 5]
    increase_filters: False
  rnn:
    units: [16, 100]
    dropout: [0.0, 0.8]
  tft:
    n_heads: [1, 8]
    hidden_dim: [16, 256]
    dropout: [0.01, 0.8]
    n_lstm_layers: [1, 5]
    static_embedding_dim: [8, 128]
    num_quantiles: [1]
    clipnorm: [0, 10.0]
  fl:
    strategy: 'fedavg'
    personalize: False
    n_rounds: [1, 20]
    server_lr: [0.0001, 0.1]
    beta_1: [0, 1]
    beta_2: [0, 1]
    tau: [0.0001, 0.1]

eval:
  results_path: 'results'
  eval_on_all_test_data: True
  retrain_interval: 0
  t_0: 12
  synth_wind:
    h1: 10
    p_s_model: 'huang'
    v2_method: 'alphaI'
    karman: 0.4
    temp_gradient: 0.00649
    interpol_method: 'polynomial'
    polynom_grad: 3
    noise: 0.0
    annual_degradation: 0.0063
    apply_ageing: True
    hourly_resolution: True
    random_seed: 42
    turbine_dir: "/mnt/nas/synthetic/wind/power_curves"
    turbine_power: 'turbine_power.csv'
    turbine_specs: "turbine_specs.csv"
    turbine_cp: "turbine_cp.csv"
    turbine_names: "turbine_names.csv"
    wind_ages: '/mnt/nas/synthetic/wind/wind_ages.npy'
  synth_pv:
    pv_ages: 'data/pv_ages.npy'

fl:
  clients:
    clientA: ['01766', '01200', '01544', '07403']
  strategy: 'fedavg'
  n_rounds: 10
  personalize: False
  fedopt:
    server_lr: 0.001
    beta_1: 0.9
    beta_2: 0.99
    tau: 0.001
  force_retrain: True
  verbose: True
  save_history: False
  num_gpus: 1
  num_cpus: 11
