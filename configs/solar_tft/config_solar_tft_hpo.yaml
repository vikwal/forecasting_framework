# Solar-TFT — Hyperparameter-Suche, raeumliche 3-Fold-CV.
#
# Aufbau (Entscheidung Viktor, 16.09.2026):
#   cv_mode: spatial     rotierende Zielstationen ueber die drei Folds aus
#                        configs/solar_folds.yaml, festes Zeitfenster. data.files
#                        und data.val_files werden dabei IGNORIERT und je Fold
#                        durch die Stationsrollen ersetzt.
#   kfolds: 3            jeder Trial trainiert dreimal -> robust gegen die
#                        Foldauswahl und vergleichbar mit der DCRNN-HPO.
#   trials: 150          bei ~55 min je Fold rund 410 GPU-Stunden brutto,
#                        mit MedianPruner realistisch deutlich weniger.
#   extra_train_files    leer: Arm A ist die Referenz, die neun Zusatzstationen
#                        aus Arm B bleiben aussen vor.
#
# Zusatzfeature u_10m, FEST aufgenommen (Entscheidung Viktor, 16.09.2026).
# Grundlage ist ein Leave-one-out-Screening auf den 21 Fold-1-Zielstationen im
# Validierungsjahr (partielle Korrelation mit dem Rest gegen ICON, kontrolliert
# gegen alle genutzten Features):
#
#     u_10m      GHI 0.015 %   DHI 0.161 %   aufgenommen, staerkster Kandidat
#     relhum_2m  GHI 0.055 %   DHI 0.010 %   verworfen, ein Drittel von u_10m
#     t_2m       GHI 0.008 %   DHI  < 0.01 % verworfen, im Rauschen
#
# Die drei standen zunaechst als BINAERE Hyperparameter in hpo.optional_features.
# Das kostete das Achtfache: die Flags aendern params.icond2_features, das in
# data_cache._get_config_hash eingeht, also bekam jede der 8 Kombinationen einen
# eigenen Cache-Eintrag — mal 3 spatiale Folds mal ~16.5 GB rund 400 GB je Host,
# bei einem Budget von 500 GB. Das Ergebnis war ein Dauerlauf von
# enforce_cache_budget, der Eintraege verwarf, die ein anderer Worker kurz darauf
# neu bauen musste. Fuer 0.06-0.16 % Restvarianz ist das nicht zu rechtfertigen;
# hpo.optional_features bleibt deshalb leer.
#
# Nicht aufgenommen, mit Begruendung:
#   td_2m    exakt aus t_2m und relhum_2m berechenbar (Magnus) — keine dritte
#            Information, nur eine dritte Schreibweise derselben zwei Groessen.
#   t_g      GHI 0.019 %, DHI 0.044 %, dazu Zirkularitaetsverdacht: die
#            Bodentemperatur ist im Modell teilweise FOLGE der modellierten
#            Einstrahlung und traegt damit vor allem die Modellmeinung, die
#            ghi_nwp schon liefert (niedrigster eigenstaendiger Anteil, 51 %).
#   v_10m    DHI 0.033 %, und u_10m deckt die Richtungsinformation bereits ab.
#   wind_speed  DHI 0.063 %, GHI 0.003 % — der Betrag traegt deutlich weniger
#            als die Richtung (wind_dir_sin allein: DHI 0.155 %). Ein Kanal
#            genuegt, aber es muss die Richtung sein; u_10m enthaelt sie.
#   prs_gsp, prg_gsp  exakt 0.000 % in beiden Zielgroessen.
#
# Zeitachse: cv_mode spatial verlangt eine FESTE Train/Val-Grenze data.val_start;
# Training liegt strikt davor, die Validierung in [val_start, test_start). Die
# Arm-Configs markierten den Val-Beginn bisher mit test_start (2024-08-01) — hier
# steht die Achse deshalb in der Form der GNN-spatial-Configs:
#
#     train_start 2023-08-01 -> val_start 2024-08-01 -> test_start 2025-08-01
#     Training                  Validierung              Testjahr, unberuehrt
#
# Suchraumgrenzen batch_size <= 512 und hidden_dim <= 128 (statt 1024/256):
# die Worker laufen auf drei GPU-Generationen — A100 80 GB (l2), RTX A6000
# 49 GB (l1) und RTX 4090 24 GB (ws). Ein Trial mit 1024/256 sprengt die 24 GB
# und killt dort den ganzen Worker (CUDA OOM beendet hpo_tft_bc.py, statt nur
# den Trial als FAIL zu markieren). Mit den kleineren Grenzen bleibt ws im
# Verbund, statt zwei von 19 Workern zu verlieren.
#
# WICHTIG: kein train_end. preprocessing.prepare_data setzt es sonst als harte
# Obergrenze des Trainingsblocks (Z. 381ff) — mit train_end 2024-07-31 UND
# test_start 2025-08-01 faellt das gesamte Validierungsjahr in die Luecke
# zwischen beiden Bloecken, und der spatiale Val-Split ist leer. Ohne train_end
# gilt train_end = test_start - 15 min, der Trainingsblock enthaelt also
# Training UND Validierung, die _split_prepared_by_time bei val_start trennt.
# Die funktionierenden spatial-Configs (configs/tft_bc/, configs/solar_dcrnn/)
# setzen aus demselben Grund weder train_end noch train_start.
#
# Erzeugt aus configs/solar_tft/config_solar_tft_fold1.yaml.

data:
  use_case: solar
  path: !ENV '${DATA_ROOT}/synthetic/raw/solar'
  nwp_path: !ENV '${DATA_ROOT}/icon-d2/parquet'
  stations_master: data/stations_master.csv
  forecast_hours:
