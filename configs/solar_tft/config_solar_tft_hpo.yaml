  - 09
  - '12'
  - '15'
  freq: 30min
  target_cols:
  - ghi
  - dhi
  files:
  - '00232'
  - '00342'
  - '00460'
  - 00591
  - 00596
  - '00662'
  - 00691
  - '00704'
  - 00853
  - 00867
  - 01048
  - '01303'
  - 01468
  - '01503'
  - '01550'
  - '01612'
  - 01684
  - 01691
  - '02171'
  - '02261'
  - 02290
  - 02483
  - 02559
  - '02601'
  - 02638
  - '03015'
  - 03098
  - '03231'
  - 03287
  - '03366'
  - '03660'
  - '04104'
  - '04177'
  - '04271'
  - 04393
  - '04466'
  - '05100'
  - '05426'
  - 05856
  - '07374'
  - '15444'
  val_files:
  - 00282
  - '00701'
  - 00880
  - 00963
  - '01346'
  - 01639
  - 01975
  - '02014'
  - '02115'
  - '02667'
  - '02712'
  - 02932
  - 03668
  - '04336'
  - 04911
  - '05142'
  - '05404'
  - 05480
  - '05705'
  - 05792
  - 05906
  train_start: '2023-08-01'
  val_start: '2024-08-01'
  test_start: '2025-08-01'
  test_end: '2026-07-31'
  train_frac: 1
  scale_x: true
  scale_y: false
  use_pca: false
  pca_components: 3
  lag_in_col: false
  n_neighbors: 5
  retrain_interval: 1
  eval_interval: 1
  ecmwf_solar_path: !ENV '${DATA_ROOT}/ecmwf/parquet/solar'
  interpol_path: !ENV '${DATA_ROOT}/synthetic/interpol/solar'
params:
  icond2_features:
  - ghi_nwp
  - dhi_nwp
  - bhi_nwp
  - kt_nwp
  - clct
  - alb_rad
  - h_snow
  - rho_snow
  - prr_gsp
  - u_10m
  known_features:
  - ghi_nwp
  - dhi_nwp
  - bhi_nwp
  - clct
  - alb_rad
  - h_snow
  - rho_snow
  - prr_gsp
  - solar_zenith_cos
  - solar_azimuth_sin
  - solar_azimuth_cos
  - dni_extra
  - ghi_clearsky
  - hour_sin
  - hour_cos
  - doy_sin
  - doy_cos
  - kt_nwp
  - airmass
  - dni_clearsky
  - dhi_clearsky
  - ecmwf_ghi
  - ecmwf_dhi
  - ecmwf_bhi
  - ecmwf_toa
  - ecmwf_bhi_clearsky
  - ecmwf_t_2m
  - ecmwf_tp
  - ecmwf_fal
  - u_10m
  observed_features:
  - ghi
  - dhi
  static_features:
  - altitude
  - latitude
  - longitude
  next_n_grid_points: 1
  get_next_grid_points_method: geodesic_next
  next_n_stations: 0
  # explizit 0 statt weggelassen: hpo_tft_bc._range faellt ohne hpo-Range auf
  # params zurueck und der Trial schreibt den Wert nach config['params'], wo
  # data_cache._get_config_hash ihn liest. Fehlt der Schluessel hier, hasht die
  # Config None und der Trial 0 — zwei Schluessel fuer dieselben Daten.
  next_n_grid_ecmwf: 0
  topo_features_path: !ENV '${DATA_ROOT}/topo_features'
  target_transform: nwp_residual
  measurement_time_label: right
  sub_hourly_fill: ffill
  max_nan_frac: 0.5
  nwp_baseline_col:
    ghi: ghi_nwp
    dhi: dhi_nwp
  daytime_zenith_threshold: 85
  nwp_workers: 8
  nwp_models:
  - icon-d2
  - ecmwf
  ecmwf_features:
  - ecmwf_ghi
  - ecmwf_dhi
  - ecmwf_bhi
  - ecmwf_toa
  - ecmwf_bhi_clearsky
  - ecmwf_t_2m
  - ecmwf_tp
  - ecmwf_fal
  random_seed: 42
  impute_night_zero: true
model:
  name: tft
  num_workers: 4
  output_dim: 96
  lookback: 96
  horizon: 96
  step_size: 96
  batch_size: 32
  epochs: 100
  lr: 0.0005
  optimizer: adam
  loss: mse
  metrics:
  - mae
  - rmse
  - r^2
  tft:
    n_heads: 4
    hidden_dim: 32
    dropout: 0.2
    n_lstm_layers: 1
    static_embedding_dim: 16
    num_quantiles: 1
    clipnorm: 10.0
  fnn:
    units: 128
    n_layers: 2
  cnn:
    filters: 128
    kernel_size: 3
    n_cnn_layers: 10
    increase_filters: false
  rnn:
    n_rnn_layers: 2
    units: 64
    dropout: 0.01
  attention_heads: 32
  callbacks: false
  shuffle: true
  force_retrain: true
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001
    monitor: val_rmse
    mode: min
    restore_best_weights: true
  parallelize: false
  lookup_hpo: false
  verbose: 1
hpo:
  studies_path: /mnt/nas/optuna_studies/optuna_viktor.db
  objectives:
  - metric: val_rmse
    direction: minimize
  objective_reduction: best
  trials: 150
  kfolds: 3
  min_train_date: null
  pruning:
    use_median_pruner: true
    n_startup_trials: 10
    # n_warmup_steps 1, nicht 2: hpo_tft_bc.py meldet je spatialem Fold einen
    # Zwischenwert (trial.report(..., step=fold_idx), Schritte 0/1/2). Bei 2 darf
    # Optuna erst ab Schritt 2 prunen — also nach dem letzten Fold, wenn die
    # Arbeit schon getan ist. Messung vom 16.09.2026: alle 20 gepruneten Trials
    # hatten alle drei Folds gerechnet und dauerten im Median 75.8 min gegen
    # 39.6 min bei den vollstaendigen. Mit 1 faellt die Entscheidung nach Fold 2
    # und der dritte entfaellt; gemeldet wird ohnehin der laufende Mittelwert
    # ueber die bisherigen Folds, nicht der Einzelwert.
    n_warmup_steps: 1
    interval_steps: 1
    disable_pruning: false
  batch_size:
  - 32
  - 512
  epochs:
  - 1
  - 150
  n_layers:
  - 1
  - 4
  n_cnn_layers:
  - 1
  - 10
  n_rnn_layers:
  - 1
  - 7
  learning_rate:
  - 0.0001
  - 0.01
  attention_heads:
  - 1
  - 64
  tft:
    n_heads:
    - 1
    - 8
    hidden_dim:
    - 8
    - 128
    dropout:
    - 0.01
    - 0.8
    n_lstm_layers:
    - 1
    - 3
    static_embedding_dim:
    - 8
    - 128
    num_quantiles:
    - 1
    clipnorm:
    - 0
    - 10.0
  cnn:
    filters:
    - 16
    - 128
    kernel_size:
    - 2
    - 5
    increase_filters: false
  rnn:
    units:
    - 16
    - 100
    dropout:
    - 0.0
    - 0.8
  fnn:
    units:
    - 32
    - 256
  fl:
    strategy: fedavg
    personalize: false
    n_rounds:
    - 1
    - 20
    server_lr:
    - 0.0001
    - 0.1
    beta_1:
    - 0
    - 1
    beta_2:
    - 0
    - 1
    tau:
    - 0.0001
    - 0.1
  cv_mode: spatial
  spatial_folds: configs/solar_folds.yaml
  max_epochs_per_trial: 100
  extra_train_files: []
  optional_features: []
eval:
  results_path: results/solar_hpo
  eval_on_all_test_data: true
  retrain_interval: 0
  t_0: 12
  exclude_imputed: true
fl:
  clients:
    clientA:
    - synth_00342
    - synth_04928
    clientB:
    - synth_05158
    - synth_01612
    clientC:
    - synth_00164
  strategy: fedavg
  n_rounds: 2
  personalize: false
  fedopt:
    server_lr: 0.001
    beta_1: 0.9
    beta_2: 0.99
    tau: 0.001
  force_retrain: true
  verbose: true
  save_history: false
  num_gpus: 1
  num_cpus: 11
