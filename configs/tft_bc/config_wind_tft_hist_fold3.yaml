# TFT non-GNN benchmark — "hist" variant (hist_wind_available=true equivalent):
# own station history INCLUDED in `observed_features`, in addition to
# neighbor-station context (next_n_stations) + ICON-D2/ECMWF known covariates
# + static topo features.
# Station splits / test window copied verbatim from
# configs/dcrnn/config_wind_dcrnn_nwp_hist_new.yaml so folds & held-out stations
# are directly comparable to the DCRNN/MTGNN benchmarks.
data:
  path: '/mnt/lambda1/nvme1/synthetic/raw/wind'
  raw_station_source: True
  files: [
            '00183', '00460', '00856', '05404', '01443', '01684', '01759', '03032', '03158', '03631',
            '03730', '05792', '05856', '15000', '05779', '04271', '02638', '02961', '05490', '05426',
            '03761', '00303', '02483', '00596', '03513', '00691', '01200', '02014', '02667', '04036',
            '04911', '00662', '00232', '05109', '01605', '05871', '15813', '05142', '01691', '01544',
            '07370', '04931', '05797', '05705', '01001', '00161', '07341', '00433', '00298', '02932',
            '02023', '01048', '02794', '13674', '03668', '05538', '01975', '04625', '01270', '02171',
            '04104', '05100', '01503', '03093', '03098', '03287', '03086', '04393', '03402', '04094',
            '00704', '05349', '01766', '02985', '06163', '01357', '01468', '00880', '04371', '01886',
            '01420', '03015', '04464', '03196', '04466', '00853', '02044', '06344', '00963', '03321',
            '02559', '07351', '04280', '02597', '00164', '07389', '03231', '01639', '06197', '06314',
            '02485', '02856', '07396']
  val_files: [
            '01550', '02907', '07393', '02497', '01757', '07367', '02812', '05397', '07412', '06159',
            '00591', '05825', '03821', '04887', '03366', '05516', '02712', '05029', '07368', '05480',
            '00701', '03167', '01358', '03126', '05800', '01587', '01694', '00282', '01869', '03925',
            '03376', '19171', '07374', '00656', '02115', '01078', '03811', '03244', '04642', '15207',
            '04745', '01580', '02261', '05629', '03379', '02252', '05930', '13965', '03028', '07369']
  test_files: [
            '00096', '00427', '00603', '05371', '00840', '00867', '00891', '00953', '01262', '01303',
            '05906', '01612', '01803', '01832', '02290', '02429', '02564', '02601', '07410', '02878',
            '02925', '02928', '03166', '03268', '03362', '03660', '03897', '03946', '03987', '04024',
            '04032', '00198', '04039', '04177', '04336', '13711', '04501', '04928', '05158', '05347',
            '01346', '05440', '05546', '07394', '07395', '07403', '15444', '19207', '00722', '00342'
            ]
  power_curves_path: '/mnt/nas/synthetic/wind/power_curves'
  nwp_path: '/mnt/nvme1/icon-d2/parquet'
  ecmwf_path: '/mnt/nvme1/ecmwf/parquet'
  stations_master: 'data/stations_master.csv'
  freq: '1h'
  train_frac: 1
  val_frac: 0.25
  test_start: '2025-04-01'   # FOLD (val-period rolling window, matches DCRNN/MTGNN)
  test_end: '2025-08-01'   # FOLD
  retrain_interval: 1
  eval_interval: 1
  target_col: 'wind_speed'
  scale_x: True
  scale_y: True
  use_pca: False
  pca_components: 3
  lag_in_col: False
  n_neighbors: 5

params:
  known_features: [
    'wind_speed_h10', 'wind_speed_h38', 'ecmwf_wind_speed_h10'
  ]
  observed_features: [
    'wind_speed',        # own station history (only present in the 'hist' variant)
    'wind_speed_next'    # nearest next_n_stations neighbor stations
  ]
  static_features: [
    'altitude',
    'latitude',
    'longitude',
  ]
  aggregate_nwp_layers: 'weighted_mean'
  get_density: False
  turbines_per_park: 1
  random_seed: 42
  next_n_grid_points: 4       # ICON-D2 nearest grid points — HPO param in hpo_cl_tft_bc.py
  next_n_grid_ecmwf: 4        # ECMWF nearest grid points — HPO param
  next_n_stations: 5          # nearest neighbor stations feeding observed window — HPO param
  nwp_models: ['icon-d2', 'ecmwf']
  ecmwf_features: ['u_wind10m', 'v_wind10m']
  aggregate_grid_points: False
  get_next_grid_points_method: 'geodesic_next'
  extrapolate: null

model:
  name: 'tft'
  fl: False
  num_workers: 8
  epochs: 60
  output_dim: 48
  lookback: 48
  horizon: 48
  step_size: 3
  batch_size: 128
  lr: 3.0e-4
  weight_decay: 1.0e-5
  optimizer: 'adam'
  loss: 'mse'
  metrics: ['mae', 'rmse', 'r^2']
  tft:
    n_heads: 4
    hidden_dim: 64
    dropout: 0.1
    rnn_type: 'lstm'
    n_lstm_layers: 1
    static_embedding_dim: 32
    quantiles: [0.5]     # deterministic point forecast (MSE), matches DCRNN/MTGNN loss convention
    clipnorm: 5
  callbacks: False
  shuffle: True
  force_retrain: True
  early_stopping:
    enabled: True
    patience: 15
    min_delta: 0.0001
    monitor: 'val_rmse'
    mode: 'min'
    restore_best_weights: True
  parallelize: False
  lookup_hpo: True
  verbose: 1

hpo:
  studies_path: null   # set to OPTUNA_STORAGE (Postgres) for the real HPO run
  objectives:
    - metric: 'val_rmse'
      direction: 'minimize'
  trials: 1000
  kfolds: 1            # single train/val split for final training (not CV)
  min_train_date: '2024-03-31'   # matches DCRNN/MTGNN — anchors val-fold boundaries (utils/data_cache.py::_replace_val_with_val_files)
  val_split: 0.05       # tiny buffer; real val comes from val_files replacement
  pruning:
    use_median_pruner: True
    n_startup_trials: 20
    n_warmup_steps: 1
    interval_steps: 1
    disable_pruning: False
  batch_size: [32, 256]
  epochs: [1, 100]
  learning_rate: [1.0e-6, 5.0e-4]
  weight_decay: [1.0e-7, 1.0e-3]
  n_layers: [1, 4]
  n_cnn_layers: [1, 10]
  n_rnn_layers: [1, 7]
  attention_heads: [1, 64]
  cnn:
    filters: [16, 128]
    kernel_size: [2, 5]
    increase_filters: False
  rnn:
    units: [16, 100]
    dropout: [0.0, 0.8]
  fnn:
    units: [32, 256]
  fl:
    strategy: 'fedavg'
    personalize: False
    n_rounds: [1, 20]
    server_lr: [0.0001, 0.1]
    beta_1: [0, 1]
    beta_2: [0, 1]
    tau: [0.0001, 0.1]
  tft:
    n_heads: [1, 8]
    hidden_dim: [32, 128]
    dropout: [0.0, 0.5]
    n_lstm_layers: [1, 3]
    static_embedding_dim: [8, 64]
    clipnorm: [0.5, 10.0]
  next_n_grid_points: [1, 7]     # consumed by hpo_cl_tft_bc.py, not utils/hpo.py::get_hyperparameters
  next_n_grid_ecmwf: [0, 4]
  next_n_stations: [0, 8]

eval:
  results_path: 'results/tft_bc'
  eval_on_all_test_data: True
  retrain_interval: 0
  t_0: 12

fl:
  strategy: 'fedavg'
