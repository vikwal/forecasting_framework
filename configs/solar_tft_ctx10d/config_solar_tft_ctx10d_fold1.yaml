# solar_tft_ctx10d, Fold 1 — Kontextfenster von 2 auf 10 Tage
#
# Einziger Unterschied zu configs/solar_tft/config_solar_tft_fold1.yaml:
# model.lookback 96 -> 480 Schritte (48 h -> 240 h bei 30-min-Raster).
# Alle uebrigen Hyperparameter kommen ueber --hpo-study aus Trial 111 der Studie
# cl_m-tft-bc_out-96_freq-30min_solar_tft_hpo; lookback selbst steht NICHT im
# Suchraum (utils/hpo.py:638) und wird von dort auch nicht ueberschrieben.
#
# Zwei Nebenwirkungen, die zum Ergebnis gehoeren:
#  * Der TFT-Encoder verarbeitet observed und known auf EINER Zeitachse
#    (utils/models.py: num_inputs = observed_dim + known_dim). Das laengere
#    Fenster gilt deshalb fuer beide — das Modell sieht 10 Tage Messhistorie UND
#    10 Tage vergangene NWP-Laeufe.
#  * create_tft_sequences stapelt dafuer ceil(480/96) = 5 vorangegangene Laeufe
#    im Abstand von je 48 h (statt bisher 2). Fehlt einer, faellt das Sample weg;
#    die Trainingsmenge sinkt entsprechend.
#
# Auswertung wie bei den uebrigen Fold-Configs mit --eval-split val.

