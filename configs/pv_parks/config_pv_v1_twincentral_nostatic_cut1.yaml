# PV real-data reference, cut 1: one central TFT trained on the Trianel METERS from 2023-07-24 to the cut, same test window as
# zero-/few-shot (2023-12-01 .. 2024-02-29); early stopping on the 4 synthetic val parks (no real data in the stopping rule), evaluated on the
# meters as holdout_files. Shows what the synthetic twins cost against a model that saw the real data.
data:
  use_case: 'pv_park'
  path: !ENV '${DATA_ROOT}/synthetic/solar/parks_pv_v1_30min'
  target_source: 'synthetic'
  files: ['pv1', 'pv2', 'pv3', 'pv5', 'pv6', 'pv7']
  twin_files: ['pv1', 'pv2', 'pv3', 'pv5', 'pv6', 'pv7']
  twin_path: !ENV '${DATA_ROOT}/synthetic/solar/trianel_twins_30min'
  meter_files: ['pv1_meter', 'pv2_meter', 'pv3_meter', 'pv5_meter', 'pv6_meter', 'pv7_meter']
  meter_path: !ENV '${DATA_ROOT}/synthetic/solar/trianel_twins_30min'
  holdout_files: ['pv1_meter', 'pv2_meter', 'pv3_meter', 'pv5_meter', 'pv6_meter', 'pv7_meter']
  nwp_path: !ENV '${DATA_ROOT}/nwp_ready_pv/icon-d2'
  nwp_site_prefix: 'park_'
  forecast_hours: ['09']
  ecmwf_solar_path: !ENV '${DATA_ROOT}/nwp_ready_pv/ecmwf/SOLAR'
  freq: '30min'
  target_col: 'power'
  train_frac: 1
  val_frac: 0.0
  train_start: '2023-07-24'
  train_end: '2023-11-30 23:30'
  test_start: '2023-12-01'
  test_end: '2024-02-29'
  data_cutoff: '2024-03-03'
  retrain_interval: 1
  eval_interval: 1
  scale_x: True
  scale_y: False
  lag_in_col: False
  n_neighbors: 5
  use_pca: False
  pca_components: 3

params:
  icond2_features: ['ghi_nwp', 'dhi_nwp', 'bhi_nwp', 't_2m', 'clct', 'h_snow', 'wind_speed_nwp']
  known_features: ['gti_nwp', 'gti_clearsky', 'kc_gti_nwp', 'kt_nwp', 'ghi_nwp', 'dhi_nwp', 't_2m', 'clct', 'h_snow', 'wind_speed_nwp',
                   'ecmwf_gti', 'ecmwf_kc_gti', 'ecmwf_ghi',
                   'solar_zenith_cos', 'solar_azimuth_sin', 'solar_azimuth_cos', 'ghi_clearsky', 'hour_sin', 'hour_cos', 'doy_sin', 'doy_cos']
  observed_features: ['power']
  static_features: []
  nwp_models: ['icon-d2', 'ecmwf']
  ecmwf_features: ['ecmwf_ghi', 'ecmwf_dhi']
  next_n_grid_points: 1
  next_n_grid_points_ecmwf: 1
  get_next_grid_points_method: 'geodesic_next'
  sub_hourly_fill: 'ffill'
  nwp_baseline_col: {power: gti_nwp}
  next_n_stations: 0
  random_seed: 42

model:
  num_workers: 0
  epochs: 100
  output_dim: 96
  lookback: 96
  horizon: 96
  step_size: 96
  batch_size: 64
  lr: 0.0005
  optimizer: 'adam'
  loss: 'mse'
  metrics: ['mae', 'rmse', 'r^2']
  shuffle: True
  callbacks: False
  force_retrain: True
  lookup_hpo: False
  verbose: 1
  parallelize: False
  fl: False
  tft:
    n_heads: 4
    hidden_dim: 64
    dropout: 0.1
    rnn_type: 'lstm'
    n_lstm_layers: 1
    static_embedding_dim: 32
    quantiles: [0.5]
    clipnorm: 7.0
  early_stopping:
    enabled: True
    patience: 10
    min_delta: 0.0001
    monitor: 'val_rmse'
    mode: 'min'
    restore_best_weights: True
  fnn: {units: 128, n_layers: 2}
  cnn: {filters: 64, kernel_size: 3, n_cnn_layers: 4, increase_filters: False}
  rnn: {n_rnn_layers: 2, units: 64, dropout: 0.1}
  attention_heads: 8
  stemgnn: {units: 32, stack_cnt: 2, multi_layer: 5, dropout: 0.5}

hpo:
  studies_path: 'studies/optuna.db'
  objectives: [{metric: 'val_rmse', direction: 'minimize'}]
  trials: 10
  kfolds: 3
  min_train_date: '2023-07-24'
  pruning: {use_median_pruner: False, n_startup_trials: 10, n_warmup_steps: 2, interval_steps: 1, disable_pruning: True}
  batch_size: [32, 256]
  epochs: [10, 100]
  n_layers: [1, 4]
  n_cnn_layers: [1, 8]
  n_rnn_layers: [1, 4]
  learning_rate: [0.0001, 0.01]
  attention_heads: [1, 8]
  fnn: {units: [32, 256]}
  cnn: {filters: [16, 128], kernel_size: [2, 5], increase_filters: False}
  rnn: {units: [16, 128], dropout: [0.0, 0.5]}
  tft: {n_heads: [1, 8], hidden_dim: [16, 128], dropout: [0.01, 0.5], n_lstm_layers: [1, 3], static_embedding_dim: [8, 64], num_quantiles: [1], clipnorm: 7.0}
  fl: {strategy: 'fedavg', personalize: False, n_rounds: [1, 30], server_lr: [0.0001, 0.1], beta_1: [0.0, 1.0], beta_2: [0.0, 1.0], tau: [0.0001, 0.1]}

eval:
  results_path: 'results/pv_parks_twincentral_nostatic_cut1'
  eval_on_all_test_data: True
  retrain_interval: 0
  t_0: 0

fl:
  strategy: 'fedavg'
  n_rounds: 1
