# final r2 2026-10-19, client N1 fold 2: best trial 58 of pv_v1_local_clients_N1, 10 parks, train issue + 48 h <= 2025-04-01, early stopping + eval in [2025-04-01, 2025-08-01).
data:
  use_case: 'pv_park'
  path: !ENV '${DATA_ROOT}/synthetic/solar/parks_pv_v1_30min'
  target_source: 'synthetic'
  files: ['SEL900727412318', 'SEL902988132653', 'SEL940123145151', 'SEL942086318702', 'SEL948807179706', 'SEL959952274758', 'SEL968421274298', 'SEL989101602927', 'SEL991206873119', 'SEL996353761180']
  nwp_path: !ENV '${DATA_ROOT}/nwp_ready_pv/icon-d2'
  nwp_site_prefix: 'park_'
  forecast_hours: ['09']
  ecmwf_solar_path: !ENV '${DATA_ROOT}/nwp_ready_pv/ecmwf/SOLAR'
  freq: '30min'
  target_col: 'power'
  train_frac: 1
  val_frac: 0.0
  train_start: '2023-07-24'
  test_start: '2025-04-01'
  test_end: '2025-07-31'
  data_cutoff: '2025-08-04'
  strict_split: True
  retrain_interval: 1
  eval_interval: 1
  scale_x: True
  scale_y: False
  lag_in_col: False
  n_neighbors: 5
  use_pca: False
  pca_components: 3

params:
  icond2_features: ['ghi_nwp', 'dhi_nwp', 'bhi_nwp', 't_2m', 'clct', 'h_snow', 'wind_speed_nwp']
  known_features: ['gti_nwp', 'gti_clearsky', 'ecmwf_gti', 'solar_zenith_cos']
  observed_features: ['power']
  static_features: []
  nwp_models: ['icon-d2', 'ecmwf']
  ecmwf_features: ['ecmwf_ghi', 'ecmwf_dhi']
  next_n_grid_points: 1
  next_n_grid_points_ecmwf: 1
  get_next_grid_points_method: 'geodesic_next'
  sub_hourly_fill: 'ffill'
  nwp_baseline_col: {power: gti_nwp}
  next_n_stations: 0
  random_seed: 42

model:
  num_workers: 0
  epochs: 100
  output_dim: 96
  lookback: 96
  horizon: 96
  step_size: 96
  batch_size: 38
  lr: 0.0017628549290143883
  optimizer: 'adam'
  loss: 'mse'
  metrics: ['mae', 'rmse', 'r^2']
  shuffle: True
  callbacks: False
  force_retrain: True
  lookup_hpo: False
  verbose: 1
  parallelize: False
  fl: False
  tft:
    n_heads: 7
    hidden_dim: 112
    dropout: 0.27067810605463966
    rnn_type: 'lstm'
    n_lstm_layers: 1
    static_embedding_dim: 32
    quantiles: [0.5]
    clipnorm: 7.0
  early_stopping:
    enabled: True
    patience: 10
    min_delta: 0.0001
    monitor: 'val_rmse'
    mode: 'min'
    restore_best_weights: True
  fnn: {units: 128, n_layers: 2}
  cnn: {filters: 64, kernel_size: 3, n_cnn_layers: 4, increase_filters: False}
  rnn: {n_rnn_layers: 2, units: 64, dropout: 0.1}
  attention_heads: 8
  stemgnn: {units: 32, stack_cnt: 2, multi_layer: 5, dropout: 0.5}

hpo:
  studies_path: 'studies/optuna.db'
  objectives: [{metric: 'val_rmse', direction: 'minimize'}]
  trials: 100
  kfolds: 3
  objective_reduction: 'best'
  pruning: {use_median_pruner: True, n_startup_trials: 10, n_warmup_steps: 1, interval_steps: 1, disable_pruning: False}
  batch_size: [32, 256]
  epochs: [10, 100]
  n_layers: [1, 4]
  n_cnn_layers: [1, 8]
  n_rnn_layers: [1, 4]
  learning_rate: [0.0001, 0.01]
  attention_heads: [1, 8]
  fnn: {units: [32, 256]}
  cnn: {filters: [16, 128], kernel_size: [2, 5], increase_filters: False}
  rnn: {units: [16, 128], dropout: [0.0, 0.5]}
  tft: {n_heads: [1, 8], hidden_dim: [16, 128], dropout: [0.01, 0.5], n_lstm_layers: [1, 3], static_embedding_dim: 32, num_quantiles: [1], clipnorm: 7.0}
  fl: {strategy: 'fedavg', personalize: False, n_rounds: [1, 30], server_lr: [0.0001, 0.1], beta_1: [0.0, 1.0], beta_2: [0.0, 1.0], tau: [0.0001, 0.1]}

eval:
  results_path: 'results/final_r2_pv_fin_cl_N1_fold2'
  eval_on_all_test_data: True
  retrain_interval: 0
  t_0: 0

fl:
  strategy: 'fedavg'
  n_rounds: 1
