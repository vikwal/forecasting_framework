wavenet:
  K_hop: 2
  # Only read when station_node_features / --station-node-features requests
  # topographic features; no effect otherwise.
  topo_features_path: '/mnt/lambda1/nvme1/topo_features'
  station_node_features: all
  aggregate_nwp: false
  dropout: 0.2
  ecmwf_feature_mode: dir_in_deg
  ecmwf_features:
  - u_wind10m
  - v_wind10m
  - wind_speed_10m
  emb_dim: 64
  forecast_horizon: 48
  grad_accum: 4
  gradient_clip: 5.0
  graph_alpha: 3.0
  handle_nans: break
  hidden: 64
  hist_wind_available: false
  history_length: 48
  horizon_decay: 0.9
  hpo:
    max_epochs_per_trial: 100
    min_train_date: '2024-03-31'
    n_folds: 3
    cv_mode: spatial          # spatial | temporal (temporal = Expanding Window ueber test_start)
    spatial_folds: 'configs/spatial_folds.yaml'
    n_val_stations: null      # raeumliche Folds definieren die Zielstationen
    params:
      K_hop:
        high: 3
        low: 1
        type: int
      dropout:
        high: 0.4
        low: 0.0
        type: float
      ecmwf_feature_mode:
        choices:
        - absolute
        - dir_in_deg
        type: categorical
      emb_dim:
        high: 128
        low: 16
        step: 4
        type: int
      grad_accum:
        high: 64
        low: 1
        type: int
      gradient_clip:
        high: 10.0
        low: 0.5
        type: float
      graph_alpha:
        high: 6.0
        low: 1.0
        type: float
      hidden:
        high: 128
        low: 32
        type: int
      horizon_decay:
        high: 0.99
        low: 0.5
        type: float
      icond2_feature_mode:
        choices:
        - absolute
        - dir_in_deg
        type: categorical
      kernel_size:
        high: 4
        low: 2
        type: int
      lr:
        high: 0.001
        log: true
        low: 1.0e-05
        type: float
      n_blocks:
        high: 18
        low: 8
        type: int
      next_n_ecmwf:
        high: 4
        low: 0
        type: int
      next_n_icond2:
        high: 7
        low: 1
        type: int
      next_n_neighbors:
        high: 90
        low: 50
        type: int
      weight_decay:
        high: 0.001
        log: true
        low: 1.0e-06
        type: float
    patience_per_trial: 10
    pruner: median
    pruner_n_startup_trials: 20
    pruner_n_warmup_steps: 1
    studies_path: studies/
    tensorboard_monitoring: true
    trials: 1000
  icond2_feature_mode: dir_in_deg
  icond2_features:
  - u_10m
  - v_10m
  - wind_speed_10m
  - wind_speed_38m
  icond2_run_hours:
  - 6
  - 9
  - 12
  - 15
  kernel_size: 2
  loss_weights_by_horizon: true
  lr: 0.0003
  max_epochs: 200
  max_neighbor_stations: 90
  max_target_stations: 10
  measurement_features:
  - wind_speed
  - wind_direction
  min_target_stations: 1
  n_blocks: 12
  n_workers: 8
  next_n_ecmwf: 4
  next_n_icond2: 4
  next_n_neighbors: 90
  nwp_nodes: false
  patience: 15
  scheduler: cosine
  target_col: wind_speed
  weight_decay: 0.0001
