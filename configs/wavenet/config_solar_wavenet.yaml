# Solar-Irradiance-Forecasting mit WAVENET
# Datensektion identisch zu configs/dcrnn/config_solar_dcrnn.yaml,
# Modellsektion aus configs/wavenet/config_wind_wavenet.yaml uebernommen.
data:
  use_case: solar                                 # routes to solar preprocessing in train_dcrnn.py
  path: '/mnt/lambda1/nvme1/synthetic/raw/solar'          # Station_XXXXX.parquet with ghi, dhi, temperature_2m, …
  nwp_path: '/mnt/lambda1/nvme1/icon-d2/parquet'          # flat SL files under {nwp_path}/SL/{run_hour:02d}/<lon>_<lat>_SL.parquet
  # interpol_path / knnimputer_path erst setzen, wenn die Imputation für Solar
  # tatsächlich gelaufen ist — die Verzeichnisse existieren derzeit nicht.
  # interpol_path: '/mnt/lambda1/nvme1/synthetic/interpol/solar'
  # knnimputer_path: '/mnt/lambda1/nvme1/synthetic/knnimputer/solar'
  stations_master: 'data/stations_master.csv'
  # Nur die 93 Stationen mit tatsächlich vorhandenen ghi/dhi-Messungen; die
  # Rollen entsprechen data/station_split.csv (identisch zum Wind-Experiment).
  files: [
            '00183', '00232', '00282', '00460', '00591', '00596', '00662', '00691', '00704', '00856',
            '00867', '00880', '00953', '00963', '01303', '01346', '01468', '01605', '01766', '02014',
            '02115', '02171', '02483', '02638', '02712', '02925', '02932', '03015', '03032', '03126',
            '03167', '03231', '03287', '03631', '03730', '04104', '04177', '04393', '04466', '04642',
            '04745', '05142', '05397', '05404', '05426', '05480', '05629', '05705', '05779', '05792',
            '05856', '06163', '06197', '07370', '07374', '15000']
  val_files: [
            '00427', '00853', '01078', '01358', '01420', '01443', '01550', '01612', '01691', '01975',
            '02261', '02290', '02559', '02601', '02667', '03660', '03987', '04911', '05100', '15444']
  test_files: [
            '00342', '00701', '01048', '01503', '01639', '01684', '02907', '03028', '03098', '03366',
            '03668', '03761', '04271', '04336', '04887', '04928', '05906']
  test_start: '2025-08-01'
  test_end:   '2026-06-27'
  # ICON-D2 SL ist nativ 15-minütig (193 Schritte je Lauf), ML (Wind) nur stündlich.
  # Zulässig ist jedes Vielfache von 15 min, das 48 h ganzzahlig teilt:
  # '15min' → 192 Leads, '30min' → 96, '1h' → 48. Modell-Horizont mitziehen!
  # BEWUSST noch 1h, waehrend CL/FL bereits auf '30min' stehen: der GNN-Solar-Pfad
  # ist durch die Messluecken blockiert und daher ungetestet. Beim Umstellen auf
  # '30min' muessen history_length/forecast_horizon auf 96 mit — und der
  # rezeptive Bereich bzw. der VRAM-Bedarf ist dann neu zu pruefen.
  freq: '1h'
  train_frac: 1
  val_frac: 0.25


wavenet:
  # Input features
  # dir_in_deg mode requires u/v pairs — use the list below instead of speed-only:
  #   icond2_features: ['u_10m', 'v_10m', 'wind_speed_10m', 'wind_speed_38m']
  #   ecmwf_features:  ['u_wind10m', 'v_wind10m', 'wind_speed_10m']
  icond2_features: ['ghi_nwp', 'dhi_nwp', 'bhi_nwp', 'clct', 'alb_rad', 'h_snow', 'rho_snow', 'prr_gsp']
  ecmwf_features: []
  icond2_feature_mode: dir_in_deg   # absolute | components | both | dir_in_deg
  ecmwf_feature_mode:  dir_in_deg   # absolute | components | both | dir_in_deg
  measurement_features: ['ghi', 'dhi']
  target_col: 'ghi'
  n_workers: 8
  icond2_run_hours: [6,9,12,15]
  station_node_features: all
  topo_features_path: '/mnt/lambda1/nvme1/topo_features'

  # NWP aggregation
  nwp_nodes: false                         # true → GATv2 over k grid points; false → concat into station.x
  next_n_icond2: 4                          # nearest ICON-D2 grid points per station; HPO varies 1-7
  next_n_ecmwf: 0                # ECMWF fuer Solar noch nicht beschafft
  aggregate_nwp: false                       # true: IDW-mean  false: concat all k points
  # nwp_out_dim: 32                          # GATv2 output dim per station (only used when nwp_nodes=true)
  # nwp_heads: 4                             # GATv2 attention heads (only used when nwp_nodes=true)

  # Time windows
  history_length: 48
  forecast_horizon: 48

  # Architecture
  hidden: 64
  n_blocks: 12         # cycle [1,2,4,8,16,32]×2 → RF=127, covers T_total=96
  K_hop: 2       # hops in MultiHopDiffusion (paper default K=2); HPO varies 1-4
  emb_dim: 64
  graph_alpha: 3.0
  kernel_size: 2
  dropout: 0.2

  # Training
  min_target_stations: 1
  max_target_stations: 10
  max_neighbor_stations: 90
  next_n_neighbors: 90   # spatial kNN subsample (analog to DCRNN); HPO varies 60-120
  hist_wind_available: false    # true = historical measurements kept for target nodes (ablation)
  # Solar: praktisch jede DWD-Solarstation hat mindestens eine Messluecke, mit
  # 'break' startet daher kein Lauf. MTGNN/WaveNet ueberspringen betroffene Fenster
  # einzeln (kein Stationsausschluss), deshalb ist 'warn' hier tragfaehig.
  # Sobald die Solar-Imputation vorliegt (data.interpol_path / knnimputer_path),
  # wieder auf 'break' setzen.
  handle_nans: warn
  loss_weights_by_horizon: true
  horizon_decay: 0.90
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  grad_accum: 4
  max_epochs: 200
  patience: 15
  gradient_clip: 5.0

  # ---------------------------------------------------------------------------
  # HPO bounds — read by hpo_wavenet.py
  # ---------------------------------------------------------------------------
  hpo:
    cv_mode: spatial
    spatial_folds: 'configs/spatial_folds.yaml'
    trials: 150
    studies_path: studies/
    tensorboard_monitoring: true
    pruner: median
    pruner_n_startup_trials: 20
    pruner_n_warmup_steps: 1
    n_folds: 3
    n_val_stations: null
    max_epochs_per_trial: 100
    patience_per_trial: 10

    params:
      next_n_icond2:
        type: int
        low: 1
        high: 7

      next_n_ecmwf:
        type: int
        low: 0
        high: 4

      hidden:
        type: int
        low: 32
        high: 128
        step: 4

      n_blocks:
        type: int
        low: 8
        high: 18

      kernel_size:
        type: int
        low: 2
        high: 4

      dropout:
        type: float
        low: 0.0
        high: 0.4

      lr:
        type: float
        low: 1.0e-5
        high: 1.0e-3
        log: true

      weight_decay:
        type: float
        low: 1.0e-6
        high: 1.0e-3
        log: true

      horizon_decay:
        type: float
        low: 0.5
        high: 0.99

      gradient_clip:
        type: float
        low: 0.5
        high: 10.0

      grad_accum:
        type: int
        low: 1
        high: 64

      K_hop:
        type: int
        low: 1
        high: 3

      emb_dim:
        type: int
        low: 16
        high: 128
        step: 4

      graph_alpha:
        type: float
        low: 1.0
        high: 6.0

      next_n_neighbors:
        type: int
        low: 50
        high: 90

      icond2_feature_mode:
        type: categorical
        choices: [absolute, dir_in_deg]

      ecmwf_feature_mode:
        type: categorical
        choices: [absolute, dir_in_deg]
