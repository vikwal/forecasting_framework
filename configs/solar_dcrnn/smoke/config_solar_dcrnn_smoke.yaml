# Smoke-Test des Solar-DCRNN-Pfads (Imputation + Multi-Target + 30min). Wegwerfbar.

data:
  use_case: solar
  path: !ENV '${DATA_ROOT}/synthetic/raw/solar'
  nwp_path: !ENV '${DATA_ROOT}/icon-d2/parquet'
  stations_master: data/stations_master.csv
  files:
  - '00232'
  - '00342'
  - '00460'
  - 00591
  - 00596
  - '00662'
  - 00691
  - '00704'
  val_files:
  - 00282
  - '00701'
  - 00880
  - 00963
  test_files:
  - 00183
  - 00856
  - 00953
  - 01358
  - '01420'
  - '01443'
  - 02925
  - '03032'
  - '03167'
  - '03631'
  - '03730'
  - '03761'
  - 03987
  - '04745'
  - 04928
  - 05397
  - 05779
  - '06163'
  - 06197
  - '07370'
  - '15000'
  test_start: '2024-03-01'
  test_end: '2024-03-15'
  freq: 30min
  train_frac: 1
  val_frac: 0.25
  val_start: '2024-02-01'
  interpol_path: !ENV '${DATA_ROOT}/synthetic/interpol/solar'
dcrnn:
  icond2_features:
  - ghi_nwp
  - dhi_nwp
  - bhi_nwp
  - clct
  - alb_rad
  - h_snow
  - rho_snow
  - prr_gsp
  ecmwf_features: []
  measurement_features:
  - ghi
  - dhi
  target_col:
  - ghi
  - dhi
  n_workers: 16
  n_ahead_prefetch: 8
  prefetch_workers: 2
  handle_nans: break
  interpolate_history: false
  next_n_icond2: 4
  next_n_ecmwf: 0
  station_connectivity: delaunay
  use_altitude_diff: true
  use_direction_features: true
  use_distance_features: true
  icond2_run_hours:
  - 6
  history_length: 96
  forecast_horizon: 96
  temporal_encoding: gru
  hidden: 64
  num_layers: 1
  K_hop: 1
  nwp_out_dim: 64
  nwp_heads: 4
  dropout: 0.1
  teacher_forcing_ratio: 0.3
  min_target_stations: 1
  max_target_stations: 10
  next_n_neighbors: 90
  loss_fn: mse
  loss_weights_by_horizon: true
  horizon_decay: 0.85
  lr: 0.0003
  weight_decay: 0.001
  batch_size: 8
  max_epochs: 200
  patience: 10
  gradient_clip: 1.0
  scheduler: plateau
  impute_night_zero: true
  epochs: 1
cache:
  use_cache: true
  cache_dir: data_cache/gnns
output:
  path: results/geostatistics
  prefix: solar_spatial_interp
