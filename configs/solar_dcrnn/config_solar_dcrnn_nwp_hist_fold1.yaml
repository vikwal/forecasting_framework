  train_frac: 1
  val_frac: 0.25
  val_start: '2024-08-01'
  interpol_path: !ENV '${DATA_ROOT}/synthetic/interpol/solar'
  ecmwf_path: !ENV '${DATA_ROOT}/ecmwf/parquet/solar'
dcrnn:
  icond2_features:
  - ghi_nwp
  - dhi_nwp
  - bhi_nwp
  - clct
  - alb_rad
  - h_snow
  - rho_snow
  - prr_gsp
  ecmwf_features:
  - ecmwf_ghi
  - ecmwf_dhi
  - ecmwf_bhi
  - ecmwf_toa
  - ecmwf_bhi_clearsky
  - ecmwf_t_2m
  - ecmwf_tp
  - ecmwf_fal
  measurement_features:
  - ghi
  - dhi
  target_col:
  - ghi
  - dhi
  n_workers: 16
  n_ahead_prefetch: 8
  prefetch_workers: 2
  handle_nans: break
  interpolate_history: false
  next_n_icond2: 4
  next_n_ecmwf: 4
  station_connectivity: delaunay
  use_altitude_diff: true
  use_direction_features: true
  use_distance_features: true
  icond2_run_hours:
  - 6
  - 9
  - 12
  - 15
  history_length: 96
  forecast_horizon: 96
  temporal_encoding: gru
  hidden: 64
  num_layers: 1
  K_hop: 2
  nwp_out_dim: 64
  nwp_heads: 4
  dropout: 0.1
  teacher_forcing_ratio: 0.3
  min_target_stations: 1
  max_target_stations: 10
  next_n_neighbors: 90
  loss_fn: mse
  loss_weights_by_horizon: true
  horizon_decay: 0.85
  lr: 0.0003
  weight_decay: 0.001
  batch_size: 64
  max_epochs: 200
  patience: 10
  gradient_clip: 1.0
  scheduler: plateau
  impute_night_zero: true
  target_transform: nwp_residual
  hist_wind_available: true
cache:
  use_cache: true
  cache_dir: data_cache/gnns
output:
  path: results/geostatistics
  prefix: solar_spatial_interp
eval:
  exclude_imputed: true
