# FedAvg comparison: identical to config_parks_v1_fl_fedgradient.yaml except fl.strategy (1 local epoch per round).
# parks_v1 -- federated day-ahead power forecast, 80 real MaStR wind parks in 8 clients
# (selection v1.1, FL_Contribution/data/mastr/wind_park_selection_v1_1.csv: R0-R3 regional,
# N0-N3 supra-regional, 10 parks each). Strategy fedgradient: per-batch gradient aggregation,
# server-side optimizer step after every batch, one round = one epoch (docs/fedgradient.md).
# Data, features, split and model exactly as config_parks_v1_cl.yaml. data.files = the 80
# client parks in CSV order (global park list, park-id codes); data.val_files = the 10 holdout parks,
# evaluated with the global model only.
#   python train_fl.py -c configs/parks_v1/config_parks_v1_fl_fedavg -m tft
