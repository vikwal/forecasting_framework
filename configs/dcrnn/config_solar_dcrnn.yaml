data:
  use_case: solar                                 # routes to solar preprocessing in train_dcrnn.py
  path: '/mnt/lambda1/nvme1/synthetic/raw/solar'          # Station_XXXXX.parquet with ghi, dhi, temperature_2m, …
  nwp_path: '/mnt/lambda1/nvme1/icon-d2/parquet'          # flat SL files under {nwp_path}/SL/{run_hour:02d}/<lon>_<lat>_SL.parquet
  # interpol_path / knnimputer_path erst setzen, wenn die Imputation für Solar
  # tatsächlich gelaufen ist — die Verzeichnisse existieren derzeit nicht.
  # interpol_path: '/mnt/lambda1/nvme1/synthetic/interpol/solar'
  # knnimputer_path: '/mnt/lambda1/nvme1/synthetic/knnimputer/solar'
  stations_master: 'data/stations_master.csv'
  # Nur die 93 Stationen mit tatsächlich vorhandenen ghi/dhi-Messungen; die
  # Rollen entsprechen data/station_split.csv (identisch zum Wind-Experiment).
  files: [
            '00183', '00232', '00282', '00460', '00591', '00596', '00662', '00691', '00704', '00856',
            '00867', '00880', '00953', '00963', '01303', '01346', '01468', '01605', '01766', '02014',
            '02115', '02171', '02483', '02638', '02712', '02925', '02932', '03015', '03032', '03126',
            '03167', '03231', '03287', '03631', '03730', '04104', '04177', '04393', '04466', '04642',
            '04745', '05142', '05397', '05404', '05426', '05480', '05629', '05705', '05779', '05792',
            '05856', '06163', '06197', '07370', '07374', '15000']
  val_files: [
            '00427', '00853', '01078', '01358', '01420', '01443', '01550', '01612', '01691', '01975',
            '02261', '02290', '02559', '02601', '02667', '03660', '03987', '04911', '05100', '15444']
  test_files: [
            '00342', '00701', '01048', '01503', '01639', '01684', '02907', '03028', '03098', '03366',
            '03668', '03761', '04271', '04336', '04887', '04928', '05906']
  test_start: '2025-08-01'
  test_end:   '2026-06-27'
  # ICON-D2 SL ist nativ 15-minütig (193 Schritte je Lauf), ML (Wind) nur stündlich.
  # Zulässig ist jedes Vielfache von 15 min, das 48 h ganzzahlig teilt:
  # '15min' → 192 Leads, '30min' → 96, '1h' → 48. Modell-Horizont mitziehen!
  # BEWUSST noch 1h, waehrend CL/FL bereits auf '30min' stehen: der GNN-Solar-Pfad
  # ist durch die Messluecken blockiert und daher ungetestet. Beim Umstellen auf
  # '30min' muessen history_length/forecast_horizon auf 96 mit — und der
  # rezeptive Bereich bzw. der VRAM-Bedarf ist dann neu zu pruefen.
  freq: '1h'
  train_frac: 1
  val_frac: 0.25


dcrnn:
  # ── Features ───────────────────────────────────────────────────────────────
  # Special derived names (computed from raw SL columns before resampling):
  #   ghi_nwp       = aswdir_s + aswdifd_s   (global horizontal irradiance)
  #   dhi_nwp       = aswdifd_s               (diffuse horizontal irradiance)
  #   bhi_nwp       = aswdir_s                (direct beam on horizontal)
  #   wind_speed_nwp = sqrt(u_10m² + v_10m²)
  # All other names are treated as direct column names in the SL parquet.
  icond2_features: ['ghi_nwp', 'dhi_nwp', 'bhi_nwp', 'clct', 'alb_rad', 'h_snow', 'rho_snow', 'prr_gsp']
  ecmwf_features: []             # set next_n_ecmwf: 0 to disable entirely
  measurement_features: ['ghi', 'dhi']
  target_col: 'ghi'
  n_workers: 16
  n_ahead_prefetch: 8
  prefetch_workers: 2
  # DCRNN verlangt einen luecken­freien (T, N, M)-Block: 'break' bricht ab,
  # 'drop' wuerde alle Solarstationen entfernen (jede hat mindestens eine Luecke).
  # Der Solar-DCRNN-Lauf braucht daher zwingend die noch ausstehende Imputation
  # (data.interpol_path / data.knnimputer_path, geostatistics/run_solar_interpolation.py).
  handle_nans: break
  interpolate_history: false

  # ── Graph ───────────────────────────────────────────────────────────────────
  next_n_icond2: 4
  next_n_ecmwf: 0                # ECMWF disabled for solar (no surface radiation fields)
  station_connectivity: delaunay
  use_altitude_diff: true
  use_direction_features: true
  use_distance_features: true
  icond2_run_hours: [6]

  # ── Time windows ────────────────────────────────────────────────────────────
  history_length: 48
  forecast_horizon: 48
  temporal_encoding: gru

  # ── DCRNN architecture ──────────────────────────────────────────────────────
  hidden: 64
  num_layers: 1
  K_hop: 1
  nwp_out_dim: 64
  nwp_heads: 4
  dropout: 0.1
  teacher_forcing_ratio: 0.3

  # ── Station subgraph sampling ───────────────────────────────────────────────
  min_target_stations: 1
  max_target_stations: 10
  next_n_neighbors: 90

  # ── Training ────────────────────────────────────────────────────────────────
  loss_fn: mse
  loss_weights_by_horizon: true
  horizon_decay: 0.85
  lr: 3.0e-4
  weight_decay: 1.0e-3
  batch_size: 64
  max_epochs: 200
  patience: 10
  gradient_clip: 1.0
  scheduler: plateau


cache:
  use_cache: true
  cache_dir: 'data_cache/gnns'

output:
  path: 'results/geostatistics'
  prefix: 'solar_spatial_interp'
