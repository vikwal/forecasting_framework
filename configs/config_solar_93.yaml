  - solar_azimuth_sin
  - solar_azimuth_cos
  - dni_extra
  - ghi_clearsky
  - hour_sin
  - hour_cos
  - doy_sin
  - doy_cos
  observed_features:
  - ghi
  - dhi
  static_features:
  - altitude
  - latitude
  - longitude
  next_n_grid_points: 1
  get_next_grid_points_method: geodesic_next
  next_n_stations: 0
  topo_features_path: !ENV '${DATA_ROOT}/topo_features'
  target_transform: none
  measurement_time_label: right
  sub_hourly_fill: ffill
  max_nan_frac: 0.5
  nwp_baseline_col:
    ghi: ghi_nwp
    dhi: dhi_nwp
  daytime_zenith_threshold: 85
  nwp_workers: 8
  nwp_models:
  - icon-d2
  ecmwf_features: []
  random_seed: 42
model:
  name: tft
  num_workers: 4
  output_dim: 96
  lookback: 96
  horizon: 96
  step_size: 96
  batch_size: 32
  epochs: 100
  lr: 0.0002
  optimizer: adam
  loss: mse
  metrics:
  - mae
  - rmse
  - r^2
  tft:
    n_heads: 4
    hidden_dim: 32
    dropout: 0.2
    n_lstm_layers: 1
    static_embedding_dim: 16
    num_quantiles: 1
    clipnorm: 1.0
  fnn:
    units: 128
    n_layers: 2
  cnn:
    filters: 128
    kernel_size: 3
    n_cnn_layers: 10
    increase_filters: false
  rnn:
    n_rnn_layers: 2
    units: 64
    dropout: 0.01
  attention_heads: 32
  callbacks: false
  shuffle: true
  force_retrain: true
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001
    monitor: val_rmse
    mode: min
    restore_best_weights: true
  parallelize: false
  lookup_hpo: true
  verbose: 1
hpo:
  studies_path: /mnt/nas/optuna_studies/optuna_viktor.db
  objectives:
  - metric: val_rmse
    direction: minimize
  trials: 150
  kfolds: 12
  min_train_date: '2024-06-30'
  val_split: 1
  pruning:
    use_median_pruner: true
    n_startup_trials: 10
    n_warmup_steps: 2
    interval_steps: 1
    disable_pruning: false
  batch_size:
