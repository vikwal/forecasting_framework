    - 1
    - 8
    hidden_dim:
    - 8
    - 256
    dropout:
    - 0.01
    - 0.8
    n_lstm_layers:
    - 1
    - 5
    static_embedding_dim:
    - 8
    - 128
    num_quantiles:
    - 1
    clipnorm:
    - 0
    - 10.0
  cnn:
    filters:
    - 16
    - 128
    kernel_size:
    - 2
    - 5
    increase_filters: false
  rnn:
    units:
    - 16
    - 100
    dropout:
    - 0.0
    - 0.8
  fnn:
    units:
    - 32
    - 256
  fl:
    strategy: fedavg
    personalize: false
    n_rounds:
    - 1
    - 20
    server_lr:
    - 0.0001
    - 0.1
    beta_1:
    - 0
    - 1
    beta_2:
    - 0
    - 1
    tau:
    - 0.0001
    - 0.1
eval:
  results_path: results
  eval_on_all_test_data: true
  retrain_interval: 0
  t_0: 12
fl:
