# Solar-Irradiance-Forecasting (Centralized Learning)
#
# Pendant zu config_wind_50.yaml. Zielgrößen sind gemessene Bestrahlungsstärken
# der DWD-Stationen, Prädiktoren die ICON-D2-Surface-Level-Prognosen.
# Details: docs/preprocess_icond2_solar.md, docs/predict_solar.md
#
# Stationsauswahl: von den 204 Stationen unter data.path führen nur 93 überhaupt
# ghi/dhi — die übrigen 111 haben die Spalten durchgehend NaN. Die Rollen
# (train/val/test) sind aus data/station_split.csv übernommen, also identisch zum
# Wind-Experiment.
# hpo.cnn/rnn/fnn/fl und die fl-Sektion werden von
# utils/hpo.py::get_hyperparameters UNBEDINGT gelesen — auch fuer TFT und
# auch bei lookup_hpo: False. Ohne sie bricht train_cl.py mit KeyError ab.
# Fuer einen zentralen TFT-Lauf sind die Werte selbst wirkungslos.

# Stationsliste bereinigt (Aug 2026): 6 Stationen enden vor test_start und
# liefern damit einen leeren Test-Split — prepare_data_for_tft bricht dann mit
# 'IndexError: index 0 is out of bounds' in get_static_features ab.
# Entfernt: files ['01605', '01766', '03126', '05629'], val_files ['00427', '01078'],
# test_files ['02907', '03028'].
# Siehe docs/preprocess_icond2_solar.md 5.1 (vorzeitiges Reihenende, 7.6 %).

