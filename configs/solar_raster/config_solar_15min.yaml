# Rasterexperiment 15min — Station 02712
#
# Variante A: Messung 10 -> 15 min flaechengewichtet umverteilt. ICON nativ.
#
# Alle drei Configs sind identisch bis auf data.freq und die daran gekoppelten
# Schrittzahlen (lookback/horizon/output_dim/step_size = 192 = 48 h / 15min).
# lookup_hpo ist aus, damit ausschliesslich das Raster variiert.
#
# lr 2e-3 statt 2e-4 und clipnorm 10 statt 1: die Ziele bleiben in W/m²
# (preprocessing.py:418 erzwingt scale_target=False fuer jedes Nicht-'power'-Ziel
# im TFT-Pfad, scale_y in der Config ist dort wirkungslos). Mit clipnorm 1.0 ist
# die Schrittweite dann ~lr, unabhaengig vom Verlust — der erste Anlauf kam in
# 71 Epochen nur von RMSE 196 auf 173 und haette den 200er-Cap gerissen.
# Beide Werte sind in allen drei Configs identisch, der Vergleich bleibt fair.
#
# Training 2023-08-01..2024-08-01, Test 2024-08-01..2025-08-01.
# Station 02712: 0.003 % Messluecken im Fenster, im Trainings-Split des
# Hauptexperiments (ruehrt dessen Test-Split nicht an).
#
# RMSE der drei Laeufe sind NICHT kommensurabel — Auswertung auf gemeinsamem
# 30-min-Raster (kgV), siehe scripts/compare_solar_raster.py

data:
  use_case: solar
  path: !ENV '${DATA_ROOT}/synthetic/raw/solar'
  nwp_path: !ENV '${DATA_ROOT}/icon-d2/parquet'
  stations_master: data/stations_master.csv
  forecast_hours:
  - '06'
  - 09
  - '12'
  - '15'
  freq: 15min
  target_cols:
  - ghi
  - dhi
  files:
  - '02712'
  val_files: []
  test_files: []
  train_start: '2023-08-01'
  test_start: '2024-08-01'
  test_end: '2025-08-01'
  train_frac: 1
  val_frac: 0.2
  scale_x: true
  scale_y: false
  use_pca: false
  pca_components: 3
  lag_in_col: false
  n_neighbors: 5
  retrain_interval: 1
  eval_interval: 3
params:
  icond2_features:
  - ghi_nwp
  - dhi_nwp
  - bhi_nwp
  - clct
  - alb_rad
  - h_snow
  - rho_snow
  - prr_gsp
  known_features:
  - ghi_nwp
  - dhi_nwp
  - bhi_nwp
  - clct
  - alb_rad
  - h_snow
  - rho_snow
  - prr_gsp
  - solar_zenith_cos
  - solar_azimuth_sin
  - solar_azimuth_cos
  - dni_extra
  - ghi_clearsky
  - hour_sin
  - hour_cos
  - doy_sin
  - doy_cos
  observed_features:
  - ghi
  - dhi
  static_features:
  - altitude
  - latitude
  - longitude
  next_n_grid_points: 1
  get_next_grid_points_method: geodesic_next
  next_n_stations: 0
  topo_features_path: !ENV '${DATA_ROOT}/topo_features'
  target_transform: none
  measurement_time_label: right
  sub_hourly_fill: ffill
  max_nan_frac: 0.5
  # Pro Zielgroesse, nicht global: ein einzelner Spaltenname wuerde JEDES Ziel
  # gegen dieselbe Spalte messen — dhi gegen ghi_nwp ergab Baseline-RMSE 165
  # statt 41 W/m² und ein Skill_NWP von +0.77, das nichts aussagt.
  nwp_baseline_col:
    ghi: ghi_nwp
    dhi: dhi_nwp
  daytime_zenith_threshold: 85
  nwp_workers: 8
  nwp_models:
  - icon-d2
  ecmwf_features: []
  random_seed: 42
model:
  name: tft
  num_workers: 4
  output_dim: 192
  lookback: 192
  horizon: 192
  step_size: 192
  batch_size: 32
  epochs: 100
  lr: 0.002
  optimizer: adam
  loss: mse
  metrics:
  - mae
  - rmse
  - r^2
  tft:
    n_heads: 4
    hidden_dim: 32
    dropout: 0.2
    n_lstm_layers: 1
    static_embedding_dim: 16
    num_quantiles: 1
    clipnorm: 10.0
  fnn:
    units: 128
    n_layers: 2
  cnn:
    filters: 128
    kernel_size: 3
    n_cnn_layers: 10
    increase_filters: false
  rnn:
    n_rnn_layers: 2
    units: 64
    dropout: 0.01
  attention_heads: 32
  callbacks: false
  shuffle: true
  force_retrain: true
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001
    monitor: val_rmse
    mode: min
    restore_best_weights: true
  parallelize: false
  lookup_hpo: false
  verbose: 1
  fl: false
hpo:
  studies_path: /mnt/nas/optuna_studies/optuna_viktor.db
  objectives:
  - metric: val_rmse
    direction: minimize
  trials: 150
  kfolds: 12
  min_train_date: '2024-06-30'
  val_split: 1
  pruning:
    use_median_pruner: true
    n_startup_trials: 10
    n_warmup_steps: 2
    interval_steps: 1
    disable_pruning: false
  batch_size:
  - 32
  - 1024
  epochs:
  - 1
  - 150
  n_layers:
  - 1
  - 4
  n_cnn_layers:
  - 1
  - 10
  n_rnn_layers:
  - 1
  - 7
  learning_rate:
  - 0.0001
  - 0.01
  attention_heads:
  - 1
  - 64
  tft:
    n_heads:
    - 1
    - 8
    hidden_dim:
    - 8
    - 256
    dropout:
    - 0.01
    - 0.8
    n_lstm_layers:
    - 1
    - 5
    static_embedding_dim:
    - 8
    - 128
    num_quantiles:
    - 1
    clipnorm:
    - 0
    - 10.0
  cnn:
    filters:
    - 16
    - 128
    kernel_size:
    - 2
    - 5
    increase_filters: false
  rnn:
    units:
    - 16
    - 100
    dropout:
    - 0.0
    - 0.8
  fnn:
    units:
    - 32
    - 256
  fl:
    strategy: fedavg
    personalize: false
    n_rounds:
    - 1
    - 20
    server_lr:
    - 0.0001
    - 0.1
    beta_1:
    - 0
    - 1
    beta_2:
    - 0
    - 1
    tau:
    - 0.0001
    - 0.1
eval:
  results_path: results/solar_raster
  eval_on_all_test_data: true
  retrain_interval: 0
  t_0: 12
fl:
  clients:
    clientA:
    - synth_00342
    - synth_04928
    clientB:
    - synth_05158
    - synth_01612
    clientC:
    - synth_00164
  strategy: fedavg
  n_rounds: 2
  personalize: false
  fedopt:
    server_lr: 0.001
    beta_1: 0.9
    beta_2: 0.99
    tau: 0.001
  force_retrain: true
  verbose: true
  save_history: false
  num_gpus: 1
  num_cpus: 11
