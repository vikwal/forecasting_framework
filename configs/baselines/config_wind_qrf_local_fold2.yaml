    01580, 01587, '01605', 01639, 01691, '01766', 01869, 01886, 01975, '02014', '02023', '02044', '02252',
    '02261', 02485, 02559, 02597, 02638, '02667', '02712', 02794, 02812, 02856, 02985, '03015', 03028,
    '03032', 03086, '03126', 03158, 03196, '03231', '03244', 03287, '03321', '03366', 03379, '03402',
    '03513', '03631', 03668, 03811, 03821, 03925, '04036', '04371', 04393, '04466', '04625', '04642',
    05029, 05109, '05142', 05349, 05397, '05426', 05480, '05516', 05792, 05800, 05856, 05930, 06159, '06163',
    '06314', '06344', '07367', 07368, 07369, '07370', 07396, '07412', '13965', '15000', '15207', '15813',
    '19171']
  val_files: [00282, 00591, '00656', 00856, '01200', '01270', '01443', '01503', 01684, 01694, '01757',
    01759, '02115', '02171', 02483, 02497, 02907, 02932, 02961, 03093, 03098, '03167', '03376', '03730',
    '03761', 04094, '04104', '04271', 04280, '04464', '04745', 04887, 04911, 04931, '05100', '05404',
    05490, 05538, 05629, '05705', 05779, 05797, 05825, 05871, 06197, '07341', '07351', '07374', 07389,
    07393, '13674']
  test_files: [00096, '00427', '00603', '05371', 00840, 00867, 00891, 00953, '01262', '01303', 05906,
    '01612', 01803, 01832, 02290, 02429, '02564', '02601', '07410', 02878, 02925, 02928, '03166', 03268,
