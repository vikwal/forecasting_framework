    '04501', 04928, 05158, '05347', '01346', '05440', '05546', 07394, 07395, '07403', '15444', '19207',
    '00722', '00342']
  val_start: '2024-08-01'
  test_start: '2025-08-01'
  test_end: '2026-03-31'
  interpol_path: !ENV '${DATA_ROOT}/synthetic/interpol/wind'
  knnimputer_path: !ENV '${DATA_ROOT}/synthetic/knnimputer/wind'
  stations_master: data/stations_master.csv
  freq: 1h
  use_case: wind

qrf:
  icond2_features: ['u_10m', 'v_10m', 'wind_speed_10m', 'wind_speed_38m']
  ecmwf_features: ['u_wind10m', 'v_wind10m', 'wind_speed_10m']
  icond2_feature_mode: dir_in_deg
  ecmwf_feature_mode: dir_in_deg
  measurement_features: ['wind_speed', 'wind_direction']
  target_col: 'wind_speed'
  icond2_run_hours: [6, 9, 12, 15]
  history_length: 48
  forecast_horizon: 48
  n_workers: 8
  topo_features_path: !ENV '${DATA_ROOT}/topo_features'
  k_i2: 4
  k_e2: 4
  random_state: 20260810

  # ---------------------------------------------------------------------------
  # HPO-Suchraum -- gelesen von hpo_qrf.py (Spezifikation 5.2)
  # ---------------------------------------------------------------------------
  hpo:
    trials: 60
    pruner: median
    pruner_n_startup_trials: 20
    pruner_n_warmup_steps: 1
    n_folds: 3
    cv_mode: spatial
    spatial_folds: 'configs/spatial_folds.yaml'

    params:
      n_estimators:
        type: int
        low: 100
        high: 400
        step: 50

      min_samples_leaf:
        type: float
        low: 1.0e-6
        high: 1.0e-3
        log: true

      max_features:
        type: float
        low: 0.15
        high: 1.0

      max_depth:
        type: int
        low: 8
        high: 40
