# configs/baselines/config_wind_qrf_local_fold2.yaml
# Generiert aus configs/mtgnn/config_wind_mtgnn_nwp_fold2.yaml (nur der data:-Block, unveraendert) plus dem
# qrf:-Block nach docs/baselines_implementation_spec.md Abschnitt 5.2/9.
# Stationsliste = data.files (102, Fold-Training) + data.val_files (51,
# Fold-Ziel) -- identisch zu spatial_fold2 in configs/spatial_folds.yaml
# (Spezifikation 1.1).

