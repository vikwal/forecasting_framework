  path: !ENV '${DATA_ROOT}/synthetic/raw/wind'
  nwp_path: !ENV '${DATA_ROOT}/icon-d2/parquet'
  ecmwf_path: !ENV '${DATA_ROOT}/ecmwf/parquet'
  files: ['00161', '00164', 00183, '00232', 00298, '00303', '00433', '00460', 00596, '00662', 00691, '00701',
