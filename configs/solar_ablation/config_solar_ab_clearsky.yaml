# Ablation C: Clear-Sky-Index als Ziel
#
# Ziel = ghi / ghi_clearsky statt W/m². Schliesst nwp_residual aus, beides sind
# Zielgroessen-Transformationen. eval.py rechnet vor den Metriken zurueck nach W/m²,
# damit RMSE und Skill_NWP mit den anderen Laeufen vergleichbar bleiben.
#
# Grenze: clearsky_index setzt Werte unter 20 W/m² Clear-Sky-Einstrahlung auf 0,
# Nacht und tiefe Daemmerung sind also nicht rekonstruierbar. Rest < 20 W/m²,
# im Mittel ~1 W/m² - klein gegen RMSE ~85, aber zugunsten dieses Laufs verzerrt.
#
# ghi_clearsky/dhi_clearsky bleiben ueber solar._select_columns erhalten, ohne
# Modell-Feature zu werden - der Lauf hat damit dieselben Eingaenge wie residual.
#
# Beide Configs identisch bis auf params.target_transform — der Kontrolllauf
# trennt den Effekt des Residuums von dem der 52 Stationen.
#
# Training 2023-08..2025-02 auf 52 Stationen,
# Validierung/Test auf 18 val_files im Fenster 2025-02..2025-08
# (zwei Winter-, zwei Fruehlings-, zwei Sommermonate).
#
# lr 2e-3 / clipnorm 10: mit clipnorm 1.0 ist die Schrittweite ~lr unabhaengig
# vom Verlust, bei Zielen in W/m² konvergiert das nicht im Epochen-Cap.
#
# RMSE und Skill_NWP sind zwischen beiden Laeufen direkt vergleichbar: im
# Residuumsraum bleiben Differenzen erhalten und die Baseline ist die
# Nullreihe. R² bezieht sich dort auf die Varianz des Residuums.

