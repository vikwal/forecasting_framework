  num_workers: 4
  output_dim: 96
  lookback: 96
  horizon: 96
  step_size: 96
  batch_size: 32
  epochs: 100
  # 5e-4 statt 2e-3: der Wert stammte aus dem Ein-Stations-Setup mit ~43
  # Schritten je Epoche. Mit 52 Stationen sind es 4140, und beide Laeufe hatten
  # ihr Optimum schon nach 2-4 Epochen und schwankten danach nur noch.
