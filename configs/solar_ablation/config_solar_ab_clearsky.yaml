  # Zeitraeume ausschliesslich ueber diese vier Grenzen. train_frac bleibt nur als
  # Pflichtfeld der Signatur stehen und greift nicht, solange test_start gesetzt ist.
  #
  # Testfenster Feb..Jul 2025: zwei Winter-, zwei Fruehlings-, zwei Sommermonate.
  # Das vorherige Fenster (2025-08-01..2026-06-27) lag im duennen Teil der Reihe.
  #
  # Zwischen train_end und test_start liegen 5 Tage Abstand. Der Lookback des ersten
  # Testfensters (96 Schritte) wird sonst aus Trainingslaeufen gespeist.
  train_start: '2023-08-01'
  train_end: '2025-01-27'
  test_start: '2025-02-01'
  test_end: '2025-08-01'
  train_frac: 1
  scale_x: true
  scale_y: false
  use_pca: false
  pca_components: 3
  lag_in_col: false
  n_neighbors: 5
  retrain_interval: 1
  # 1 statt 3: jede Testperiode erzwingt ein eigenes Preprocessing der 52
  # Stationen. Fuer den A/B-Vergleich genuegt eine Auswertung ueber das ganze
  # Testfenster, und der Lauf wird dadurch rund dreimal kuerzer.
  eval_interval: 1
